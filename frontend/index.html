<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Todo App</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-avatar-center">
          <i class="ri-user-3-line"></i>
        </div>

        <h2 class="auth-title">Sign In</h2>

        <p class="auth-subtitle">Log in to access your Todo list.</p>
      </div>

      <form id="loginCredentialsForm" class="auth-form-step">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>

          <div class="input-with-icon">
            <i class="ri-mail-line"></i>

            <input type="email" id="loginEmail" name="email" class="form-control" placeholder="Enter your email"
              autocomplete="email" required />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>

          <div class="input-with-icon input-password">
            <i class="ri-lock-line"></i>

            <input type="password" id="loginPassword"  name="password" class="form-control"
              placeholder="Enter your password" autocomplete="current-password" required />

            <button type="button" class="btn-toggle-password" id="registerPasswordIcon onclick="togglePassword()" title="Toggle password visibility">
              <i class="ri-eye-line" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <div id="loginCredentialsError" class="auth-error-message hidden" role="alert"></div>
        <div id="loginSuccess" class="auth-success-message hidden" role="status"></div>

        <button type="submit" class="btn btn-primary btn-block auth-submit-btn" id="loginBtn">
          <a href="todo.html">
            <span>Log In</span>
          </a>
          <i class="ri-arrow-right-line"></i>
        </button>
      </form>
      <div id="loginCredentialsError" class="auth-error-message hidden"></div>

      <div id="loginSuccess" class="auth-success-message hidden"></div>
      <p class="auth-subtitle">
        Don't have an account?
        <button type="button" id="showRegisterBtn">
          <a href="register.html">Create One</a>
        </button>
      </p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
